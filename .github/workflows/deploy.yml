name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build site with prerendering
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Prefix static public asset paths for GitHub Pages subfolder
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: node fix-paths.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Copy 404 fallback for SPA client-side routing
        run: cp .output/public/index.html .output/public/404.html || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ".output/public"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
